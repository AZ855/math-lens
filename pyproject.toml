[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "math-lens"
version = "0.1.0"
description = "Mathematical lenses for interpreting images"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "Pillow",
    "scipy",
    "streamlit",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"math_lens.ui" = ["assets/*.js", "assets/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
