<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;background:transparent;font:12px system-ui,sans-serif}
#reveal-root{position:relative;margin:auto}canvas{display:block;width:100%;height:auto;border-radius:8px;touch-action:none}
canvas:focus-visible{outline:2px solid #507bad;outline-offset:-2px}
#brush-cursor{position:absolute;border:1px solid #707070;border-radius:50%;pointer-events:none;display:none;background:rgba(255,255,255,.05);box-shadow:0 0 0 1px rgba(255,255,255,.7)}
#error{color:#a33232;padding:8px}
</style></head><body>
<main id="reveal-root"><canvas id="reveal-canvas" tabindex="0" aria-label="Layer Reveal canvas. S starts and Q pauses; controls are in the sidebar."></canvas><div id="brush-cursor"></div></main>
<div id="error" role="status"></div>
<script src="reveal_state.js"></script><script src="component_canvas.js"></script>
</body></html>
